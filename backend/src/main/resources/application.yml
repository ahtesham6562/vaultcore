spring:
  application:
    name: vaultcore-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vaultcore}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:ahtesham@6562}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false





  threads:
    virtual:
      enabled: true

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:dmF1bHRjb3JlU3VwZXJTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24yMDI2}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: 604800000

fraud:
  threshold: ${FRAUD_THRESHOLD:50000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    vaultcore_backend: DEBUG
    org.springframework.security: INFO
    org.springframework.web: DEBUG