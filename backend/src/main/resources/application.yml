spring:
  application:
    name: vaultcore-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vaultcore}
    username: ${SPRING_DATASOURCE_USERNAME:vaultuser}
    password: ${SPRING_DATASOURCE_PASSWORD:vaultpass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:vaultcore-dev-secret-key-change-in-production-min-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: 604800000

fraud:
  threshold: ${FRAUD_THRESHOLD:50000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.vaultcore: DEBUG
    org.springframework.security: INFO